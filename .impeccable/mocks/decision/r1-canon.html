<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estándar del rubro</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#0F2A5C}
header{height:84px;display:flex;justify-content:space-between;align-items:center;padding:0 64px;box-shadow:0 1px 0 #E3E8F0}
header b{font:700 28px Georgia,serif}header nav{display:flex;gap:32px;font:500 16px Arial;align-items:center}
header .c{background:#1A5FC4;color:#fff;padding:12px 22px;border-radius:8px}
.hero{background:#F3F6FA;padding:80px 64px 60px;text-align:center}
h1{font:700 62px/1.05 "Helvetica Neue",Arial,sans-serif}
.hero p{font:400 22px/1.4 Arial;margin:18px 0 34px;color:#33476E}
.sel{display:inline-flex;gap:12px;background:#fff;padding:14px;border-radius:14px;box-shadow:0 6px 24px rgba(15,42,92,.12)}
.sel span{padding:20px 26px;border-radius:10px;font:600 22px Arial;border:1px solid #D5DEEA}
.sel .go{background:#1A5FC4;color:#fff;border-color:#1A5FC4}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px 64px}
.card{background:#fff;border:1px solid #E3E8F0;border-radius:12px;padding:28px;font:600 24px Arial}
.card i{display:block;width:44px;height:44px;border-radius:50%;background:#1A5FC4;margin-bottom:14px}
</style></head><body>
<header><b>Brokers Asociados</b><nav><span>Seguros</span><span>Productores</span><span>Contacto</span><span class="c">Cotizá</span></nav></header>
<div class="hero"><h1>Cotizá tu seguro en minutos</h1><p>Más de 35 años asesorando a familias y empresas de Mar del Plata.</p>
<div class="sel"><span>Auto / Moto</span><span>Hogar</span><span>Accidentes</span><span>Otras</span><span class="go">Cotizar</span></div></div>
<div class="cards"><div class="card"><i></i>Asesoramiento personalizado</div><div class="card"><i></i>10 aseguradoras</div><div class="card"><i></i>Asistencia en siniestros</div></div>
</body></html>
