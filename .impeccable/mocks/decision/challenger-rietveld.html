<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Casa de paneles corredizos</title>
<style>
:root{--w:#F4F4F0;--g:#BDBDB8;--k:#111;--r:#D0281E;--y:#F2C200;--b:#1D4FA0}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--k);font-family:"Futura","Century Gothic",Arial,sans-serif;color:var(--k);display:grid;grid-template-columns:860px 1fr;grid-template-rows:96px 1fr 220px;gap:8px}
.top{grid-column:1/3;background:var(--w);display:flex;justify-content:space-between;align-items:center;padding:0 48px}
.top b{font:700 30px Georgia,serif;color:#16306B}.top b span{font:600 13px Arial;letter-spacing:.4em;color:#1E7A4C;margin-left:10px}
.top nav{display:flex;gap:32px;font:500 17px Futura,sans-serif;text-transform:lowercase}
.hero{background:var(--w);padding:64px 56px;position:relative}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--b)}
h1{font:500 78px/1 Futura,"Century Gothic",sans-serif;text-transform:lowercase;letter-spacing:-.02em;max-width:12ch}
.hero p{font:400 22px/1.4 Arial;max-width:40ch;margin:26px 0 34px}
.btns{display:flex;gap:8px}
.btn{padding:22px 32px;font:600 24px Futura,sans-serif;text-transform:lowercase;background:var(--k);color:var(--w)}
.btn.wa{background:var(--w);color:var(--k);outline:4px solid var(--k);outline-offset:-4px}
.panels{background:var(--g);display:grid;grid-template-rows:1fr 1fr;gap:8px}
.panel{background:var(--w);padding:40px;position:relative;font:500 40px Futura,sans-serif;text-transform:lowercase}
.panel.on::after{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:var(--y)}
.panel.off{background:var(--g)}
.foot{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 320px;gap:8px}
.foot div{background:var(--w);padding:28px;font:500 28px Futura,sans-serif;text-transform:lowercase}
.foot .s{background:var(--r);color:var(--w)}
</style></head><body>
<div class="top"><b>brokers<span>ASOCIADOS</span></b><nav><span>cotizá</span><span>seguros</span><span>productores</span><span>contacto</span></nav></div>
<div class="hero"><h1>te cubrimos en mar del plata hace 35 años</h1><p>Elegimos por vos la aseguradora, la cobertura y el precio entre diez compañías.</p><div class="btns"><span class="btn">cotizá tu seguro</span><span class="btn wa">whatsapp</span></div></div>
<div class="panels"><div class="panel on">para vos</div><div class="panel off">para tu empresa</div></div>
<div class="foot"><div>auto y moto</div><div>hogar</div><div>accidentes</div><div>vida</div><div class="s">siniestros →</div></div>
</body></html>
