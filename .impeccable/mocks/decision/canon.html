<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estándar del rubro</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#0F2A5C}
header{height:84px;display:flex;justify-content:space-between;align-items:center;padding:0 64px;box-shadow:0 1px 0 #E3E8F0}
header b{font:700 28px Georgia,serif}header nav{display:flex;gap:32px;font:500 16px Arial}
header .c{background:#1A5FC4;color:#fff;padding:12px 22px;border-radius:8px}
.hero{height:520px;background:linear-gradient(90deg,rgba(15,42,92,.85),rgba(15,42,92,.7)),linear-gradient(135deg,#8AA9C9,#C9D6E2);color:#fff;padding:110px 64px}
h1{font:700 64px/1.05 "Helvetica Neue",Arial,sans-serif;max-width:14ch}
.hero p{font:400 22px/1.4 Arial;max-width:40ch;margin:22px 0 30px}
.hero span{display:inline-block;background:#1A5FC4;padding:20px 30px;border-radius:8px;font:600 22px Arial}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px 64px}
.card{background:#F3F6FA;border-radius:12px;padding:28px;font:600 26px Arial}
.card i{display:block;width:48px;height:48px;border-radius:50%;background:#1A5FC4;margin-bottom:16px}
</style></head><body>
<header><b>Brokers Asociados</b><nav><span>Inicio</span><span>Seguros</span><span>Productores</span><span>Contacto</span><span class="c">Cotizá</span></nav></header>
<div class="hero"><h1>Protegé lo que más querés</h1><p>Más de 35 años asesorando a familias y empresas de Mar del Plata.</p><span>Cotizá ahora</span></div>
<div class="cards"><div class="card"><i></i>Asesoramiento personalizado</div><div class="card"><i></i>10 aseguradoras</div><div class="card"><i></i>Asistencia en siniestros</div></div>
</body></html>
